# Weekly check of https://data.stortinget.no/nyhetsoversikt/, which has no RSS
# feed. Opens an issue labelled "api-news" for every news item that is not
# already covered by an issue. See .github/scripts/api_news.R.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

name: API-news

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  api-news:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      # Items published before this date are skipped. Set to the date of the
      # latest item when the workflow was added (API rate limit, 22.09.2025),
      # so the first run opens exactly one issue as a test.
      SINCE: "2025-09-22"

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install rvest
        run: install.packages("rvest")
        shell: Rscript {0}

      - name: Open issues for new news items
        run: Rscript .github/scripts/api_news.R

      # Scheduled workflows in public repos are disabled after 60 days without
      # repository activity; re-enabling the workflow through the API resets that
      # timer. (`gh workflow enable` only matches already disabled workflows.)
      - name: Keep schedule alive
        run: gh api --method PUT "repos/$GH_REPO/actions/workflows/api-news.yaml/enable"
